<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer skills check – ESOL</title>
<style>
:root{
  --paper:#EEF2F5; --sheet:#FFFFFF; --ink:#13233A; --soft:#4A5B70;
  --line:#7A2E6B; --line-soft:#F1E4EE; --ok:#1E7B3C; --ok-soft:#E3F3E8;
  --bad:#B42318; --bad-soft:#FBE7E5; --rule:#CBD5DF; --focus:#FFC83D; --link:#1A4FB4;
  --base:19px;
  color-scheme: light;
}
body.big{ --base:23px; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  font-family: Verdana, Tahoma, "Segoe UI", Arial, sans-serif;
  font-size: var(--base); line-height:1.5; color:var(--ink); background:var(--paper);
}
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:4px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* Header and route line */
header{ background:var(--sheet); border-bottom:1px solid var(--rule); }
.head-in{ max-width:820px; margin:0 auto; padding:14px 20px 10px; }
.head-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand{ font-weight:700; font-size:1.05em; margin:0; }
.tools{ display:flex; gap:8px; }
.tool{ background:none; border:2px solid var(--rule); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:.8em; }
.tool[aria-pressed="true"]{ border-color:var(--ink); background:var(--ink); color:#fff; }
.route{ display:flex; margin:14px 0 4px; padding:0; list-style:none; position:relative; }
.route li{ flex:1; text-align:center; position:relative; font-size:.62em; color:var(--soft); padding-top:24px; }
.route li::before{ content:""; position:absolute; top:8px; left:0; right:0; height:6px; background:var(--rule); }
.route li:first-child::before{ left:50%; } .route li:last-child::before{ right:50%; }
.route li.done::before, .route li.now::before{ background:var(--line); }
.route li.now::before{ right:50%; }
.route li:last-child.now::before{ right:50%; }
.route li span.stop{ position:absolute; top:2px; left:50%; transform:translateX(-50%); width:18px; height:18px; border-radius:50%; background:#fff; border:4px solid var(--rule); z-index:1; }
.route li.done span.stop{ border-color:var(--line); background:var(--line); }
.route li.now span.stop{ border-color:var(--line); width:24px; height:24px; top:-1px; }
.route li.now{ color:var(--ink); font-weight:700; }
.count{ font-size:.75em; color:var(--soft); margin:6px 0 0; }

/* Sheet */
main{ max-width:820px; margin:0 auto; padding:22px 20px 60px; }
.sheet{ background:var(--sheet); border:1px solid var(--rule); border-radius:6px; padding:26px 26px 22px; }
h1{ font-size:1.5em; line-height:1.25; margin:0 0 10px; }
h2{ font-size:1.25em; margin:0 0 6px; }
h3{ font-size:1em; margin:20px 0 8px; }
p{ margin:0 0 12px; }
.ask{ font-size:1.1em; margin:0 0 16px; }
.muted{ color:var(--soft); font-size:.85em; }
.copytext{ font-family: Consolas, "Courier New", monospace; font-size:1.25em; background:var(--paper); padding:4px 10px; border-radius:4px; display:inline-block; letter-spacing:.02em; }

/* Controls */
.field{ display:block; width:100%; border:2px solid #8A99AB; border-radius:6px; padding:12px; background:#fff; font-size:1em; }
.field:focus{ border-color:var(--ink); }
label.lab{ display:block; font-weight:700; margin:14px 0 6px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); background:var(--ink); color:#fff; border-radius:6px; padding:12px 22px; font-weight:700; cursor:pointer; min-height:52px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.ghost{ background:#fff; color:var(--ink); }
.btn.small{ min-height:40px; padding:6px 14px; font-size:.85em; }
.btn.go{ background:var(--ok); border-color:var(--ok); }
.nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:26px; padding-top:18px; border-top:1px solid var(--rule); flex-wrap:wrap; }
.skip{ background:none; border:none; color:var(--soft); text-decoration:underline; cursor:pointer; padding:8px 0; font-size:.85em; }
.dunno{ display:inline-flex; align-items:center; gap:10px; border:3px solid #C98A00; background:#FFF4D6; color:var(--ink); border-radius:6px; padding:10px 20px; font-weight:700; cursor:pointer; min-height:52px; }
.dunno:hover{ background:#FFE9A8; }
.dunno .em{ font-size:1.6em; line-height:1; }

.picks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.pick{ border:3px solid var(--rule); background:#fff; border-radius:8px; padding:16px 12px; cursor:pointer; text-align:center; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
.pick:hover{ border-color:#8A99AB; }
.pick[aria-pressed="true"]{ border-color:var(--line); background:var(--line-soft); }
.pick .em{ font-size:2.4em; line-height:1; }
.picks.icons{ grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); }
.picks.icons .em{ font-size:2.6em; }
.picks.list{ grid-template-columns:1fr; }
.picks.list .pick{ text-align:left; align-items:flex-start; }

.msg{ margin-top:14px; padding:10px 14px; border-radius:6px; background:var(--paper); }
.msg.ok{ background:var(--ok-soft); color:var(--ok); font-weight:700; }
.msg.bad{ background:var(--bad-soft); color:var(--bad); }

/* Simulated desktop */
.desk{ position:relative; background:#2F5D7C; border-radius:6px; min-height:260px; padding:18px; color:#fff; user-select:none; -webkit-user-select:none; overflow:hidden; }
.dicon{ display:inline-flex; flex-direction:column; align-items:center; width:110px; padding:8px; border:2px solid transparent; border-radius:6px; background:none; color:#fff; cursor:default; touch-action:manipulation; }
.dicon .em{ font-size:3em; line-height:1.1; }
.dicon.sel{ background:rgba(255,255,255,.25); border-color:rgba(255,255,255,.6); }
.win{ background:#fff; color:var(--ink); border-radius:6px; overflow:hidden; }
.win-bar{ background:#DDE4EB; padding:6px 12px; font-weight:700; font-size:.85em; }
.win-body{ padding:14px; }
.drag{ position:absolute; touch-action:none; cursor:grab; }
.drag.lift{ cursor:grabbing; z-index:5; filter:drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
.target.hot{ background:rgba(255,255,255,.35); border-color:#fff; }
.ctx{ position:absolute; background:#fff; color:var(--ink); border:1px solid #8A99AB; border-radius:4px; box-shadow:0 4px 14px rgba(0,0,0,.3); min-width:160px; z-index:9; padding:4px 0; }
.ctx button{ display:block; width:100%; text-align:left; background:none; border:none; padding:8px 16px; cursor:pointer; }
.ctx button:hover, .ctx button:focus{ background:#E5ECF3; }
.scrollbox{ height:230px; overflow-y:auto; border:2px solid #8A99AB; border-radius:6px; padding:14px; background:#fff; }

/* Simulated browser */
.browser{ border:2px solid #8A99AB; border-radius:8px; overflow:hidden; background:#fff; }
.bbar{ display:flex; align-items:center; gap:8px; background:#E4E9EE; padding:8px; }
.bbar .navb{ font-size:1.1em; color:#6A7A8C; padding:0 4px; user-select:none; }
.bbar input{ flex:1; border:1px solid #9AA8B7; border-radius:999px; padding:8px 14px; background:#fff; min-width:0; }
.bpage{ padding:18px; min-height:180px; }
.slogo{ font-size:1.8em; font-weight:700; text-align:center; color:var(--line); margin:10px 0 14px; }
.srow{ display:flex; gap:8px; max-width:520px; margin:0 auto; }
.srow input{ flex:1; border:2px solid #9AA8B7; border-radius:999px; padding:10px 16px; min-width:0; }
.srow button{ border:2px solid #9AA8B7; background:#fff; border-radius:999px; padding:0 16px; cursor:pointer; font-size:1.1em; }
.res{ display:block; width:100%; text-align:left; background:#fff; border:3px solid transparent; border-radius:6px; padding:10px; cursor:pointer; margin-bottom:6px; }
.res[aria-pressed="true"]{ border-color:var(--line); background:var(--line-soft); }
.res .t{ color:var(--link); text-decoration:underline; font-size:1.05em; display:block; }
.res .u{ color:#1E6B34; font-size:.8em; display:block; }
.res .d{ color:var(--soft); font-size:.8em; display:block; }
.spons{ font-weight:700; font-size:.75em; color:var(--ink); }
table.hours{ border-collapse:collapse; width:100%; max-width:420px; }
table.hours td, table.hours th{ border:1px solid var(--rule); padding:6px 10px; text-align:left; }
.addr{ display:flex; gap:8px; align-items:center; font-family:Consolas,"Courier New",monospace; font-size:.85em; background:#E4E9EE; border-radius:999px; padding:8px 14px; width:100%; word-break:break-all; }
.notsec{ color:var(--bad); font-family:Verdana,Tahoma,sans-serif; font-weight:700; font-size:.9em; }

/* Simulated email */
.mail{ border:2px solid #8A99AB; border-radius:8px; overflow:hidden; background:#fff; }
.mail-top{ background:#1F4E79; color:#fff; padding:8px 14px; font-weight:700; font-size:.9em; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.mail-grid{ display:grid; grid-template-columns:minmax(200px,38%) 1fr; min-height:260px; }
@media (max-width:640px){ .mail-grid{ grid-template-columns:1fr; } }
.inbox{ border-right:1px solid var(--rule); }
.mitem{ display:block; width:100%; text-align:left; background:#fff; border:none; border-bottom:1px solid var(--rule); padding:10px 12px; cursor:pointer; font-size:.82em; }
.mitem b{ display:block; }
.mitem[aria-pressed="true"]{ background:var(--line-soft); box-shadow:inset 5px 0 0 var(--line); }
.mread{ padding:14px; font-size:.9em; }
.mrow{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--rule); padding:6px 0; }
.mrow span{ width:80px; color:var(--soft); font-size:.85em; flex:none; }
.mrow input{ flex:1; border:2px solid #8A99AB; border-radius:4px; padding:8px 10px; min-width:0; background:#fff; cursor:text; }
.mrow input:focus{ border-color:var(--ink); }
.mrow input[readonly]{ background:var(--paper); border-color:var(--rule); cursor:default; }
.note{ border-left:6px solid var(--line); background:var(--line-soft); padding:10px 14px; border-radius:0 6px 6px 0; margin-bottom:14px; }
.note p{ margin:0 0 4px; }
.chip{ display:inline-flex; gap:8px; align-items:center; background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:4px 12px; font-size:.85em; margin-top:8px; }
.modal-back{ position:fixed; inset:0; background:rgba(19,35,58,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal{ background:#fff; border-radius:8px; width:min(460px,100%); overflow:hidden; }
.modal .win-body .pick{ flex-direction:row; justify-content:flex-start; min-height:48px; padding:8px 12px; }

/* Online form */
.oform{ border:2px solid #8A99AB; border-radius:8px; padding:18px; }
.oform select{ border:2px solid #8A99AB; border-radius:6px; padding:8px; background:#fff; margin-right:6px; margin-bottom:6px; }
.err{ color:var(--bad); font-size:.8em; display:block; margin-top:4px; }
.choice-line{ display:flex; align-items:center; gap:10px; margin:6px 0; }
.choice-line input{ width:24px; height:24px; }

/* Results */
.sec-res{ display:grid; grid-template-columns:1fr auto; gap:4px 16px; border-top:1px solid var(--rule); padding-top:12px; }
.sec-res div{ padding:6px 0; border-bottom:1px solid var(--rule); }
.bar{ height:10px; background:var(--rule); border-radius:5px; overflow:hidden; margin-top:4px; }
.bar i{ display:block; height:100%; background:var(--line); }
.band{ font-size:1.2em; font-weight:700; color:var(--line); }
details{ margin-top:16px; }
summary{ cursor:pointer; font-weight:700; }
table.det{ border-collapse:collapse; width:100%; font-size:.8em; margin-top:8px; }
table.det td, table.det th{ border-bottom:1px solid var(--rule); padding:6px; text-align:left; }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
.code{ width:100%; font-family:Consolas,"Courier New",monospace; font-size:.7em; border:2px dashed #8A99AB; border-radius:6px; padding:10px; background:var(--paper); }

/* Teacher area */
.tgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px 16px; }
.overflow{ overflow-x:auto; }
table.coll{ border-collapse:collapse; font-size:.72em; min-width:100%; }
table.coll th, table.coll td{ border:1px solid var(--rule); padding:4px 8px; white-space:nowrap; }
table.coll th{ background:var(--paper); }
.hidden{ display:none !important; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="head-top">
      <p class="brand" id="brand">Computer skills check</p>
      <div class="tools">
        <button class="tool" id="bigBtn" aria-pressed="false">Bigger text</button>
      </div>
    </div>
    <ol class="route hidden" id="route" aria-label="Test sections"></ol>
    <p class="count hidden" id="count"></p>
  </div>
</header>
<main><div class="sheet" id="app" aria-live="polite"></div></main>

<script>
(function(){
"use strict";

/* ---------- Settings from the link ----------
   ?tl=Atin|atin@x;Barry|barry@x   teachers students can choose (email optional)
   &t=teacher@email   (older links) single teacher email
   &c=E2A             class name
   &f=FORMLINK        pre-filled Microsoft Form link (overrides DEFAULT_FORM below)
   &s=UKICFS          sections to include (any order/subset)
   ?mode=teacher      opens the teacher setup page                                  */
/* Paste your Microsoft Form pre-filled link between the quotes. Every student link then uses it. */
const DEFAULT_FORM = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mUft038080m159qCPJXo2Y1qZCuioLZMr502V7pP7tRUN0hDTUZZQlhFUTRETU5RT1dEVzZMNlFOWSQlQCNjPTEu&ra3cc52ae57554be3b58eab2784f9484b=NAME&ra3ff38e9da894395b81027ba36d48acd=NUMBER&r5b1587f25b734fcd81649ff67c41be32=TEACHER&r0fa48ae72ace4d698a728e55812f11c2=%22LEVEL%22&ra6fa3be9e26f4e45890b645010bafadb=SCORE&r81ddab9b551b447fb668a6c23d6a4af6=RESULT";
/* Level wording as it appears in the form's choice options, where it differs from the test */
const FORM_LEVELS = {};
const Q = new URLSearchParams(location.search);
const CFG = {
  teacher: (Q.get("t") || "").trim(),
  teachers: (Q.get("tl") || "").split(";").map(x => { const [n, e] = x.split("|"); return {name:(n || "").trim(), email:(e || "").trim()}; }).filter(x => x.name),
  cls: (Q.get("c") || "").trim(),
  form: (Q.get("f") || DEFAULT_FORM).trim(),
  secs: (Q.get("s") || "UKICFS").toUpperCase(),
  mode: Q.get("mode") || ""
};
const STORE = "ictCheck_v3";
const VERSION = "ICTv3";

/* ---------- Helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = id => document.getElementById(id);
const norm = s => (s || "").toLowerCase().replace(/[^a-z0-9@.]/g, "");
const lettersOnly = s => (s || "").toLowerCase().replace(/[^a-z]/g, "");
function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} }
function clearSave(){ try { localStorage.removeItem(STORE); } catch(e){} }
function msg(box, text, kind){
  let m = box.querySelector(":scope > .msg");
  if (!m){ m = h("div", {class:"msg"}); box.append(m); }
  m.className = "msg" + (kind ? " " + kind : "");
  m.textContent = text;
}
function copyText(text, onDone){
  const fallback = () => {
    const ta = h("textarea", {style:"position:fixed;left:-9999px"}); ta.value = text;
    document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); onDone(ok);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => onDone(true), fallback);
  } else fallback();
}
function download(name, text, type){
  const blob = new Blob([text], {type: type || "text/plain"});
  const a = h("a", {href: URL.createObjectURL(blob), download: name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function stamp(d){
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

/* A set of picture/text choices; result stored in t.picked */
function choices(box, t, opts, cls){
  const wrap = h("div", {class:"picks " + (cls || ""), role:"group"});
  opts.forEach((o, i) => {
    const b = h("button", {class:"pick", type:"button", "aria-pressed":"false", "aria-label": o.aria || null,
      onclick: () => {
        wrap.querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true"); t.picked = i;
      }});
    if (o.em) b.append(h("span", {class:"em", "aria-hidden":"true"}, o.em));
    if (o.node) b.append(o.node); else if (o.label) b.append(h("span", null, o.label));
    wrap.append(b);
  });
  box.append(wrap);
  return wrap;
}
const pickTask = (correct) => ({ check: t => t.picked === correct, note: t => t.picked === undefined ? "no answer" : "" });

/* ---------- Sections and tasks ---------- */
const SECTIONS = [
  {key:"U", name:"Mouse and screen"},
  {key:"K", name:"Keyboard"},
  {key:"I", name:"Internet"},
  {key:"C", name:"Email"},
  {key:"F", name:"Files"},
  {key:"S", name:"Staying safe"}
];

const TASKS = [
/* ===== Mouse and screen ===== */
{ id:"U1", sec:"U", title:"Click a picture",
  ask:"Click the computer.",
  build(box, t){
    choices(box, t, [{em:"📱",label:"Phone"},{em:"💻",label:"Computer"},{em:"🚗",label:"Car"},{em:"📺",label:"TV"}]);
  }, ...pickTask(1) },

{ id:"U2", sec:"U", title:"Double-click",
  ask:"Double-click the folder to open it.",
  build(box, t){
    const desk = h("div", {class:"desk"});
    let last = 0;
    const open = () => {
      if (t.ok) return; t.ok = true;
      desk.innerHTML = "";
      desk.append(h("div", {class:"win"},
        h("div", {class:"win-bar"}, "📂 Photos"),
        h("div", {class:"win-body"}, h("span", {style:"font-size:2em"}, "🖼️ 🖼️ 🖼️"), h("p", null, "The folder is open."))));
    };
    const f = h("button", {class:"dicon", type:"button", "aria-label":"Photos folder",
      onclick: () => { f.classList.add("sel"); t.clicked = true; },
      ondblclick: open,
      onpointerup: (e) => { if (e.pointerType !== "mouse"){ const n = Date.now(); if (n - last < 450) open(); last = n; } }
    }, h("span", {class:"em", "aria-hidden":"true"}, "📁"), "Photos");
    desk.append(f); box.append(desk);
  },
  check: t => !!t.ok, note: t => t.ok ? "" : (t.clicked ? "single click only" : "") },

{ id:"U3", sec:"U", title:"Drag and drop",
  ask:"Drag the photo into the Holiday folder.",
  build(box, t){
    const desk = h("div", {class:"desk", style:"min-height:280px"});
    const target = h("div", {class:"dicon target", style:"position:absolute;right:24px;top:40px"},
      h("span", {class:"em", "aria-hidden":"true"}, "📁"), "Holiday");
    const item = h("div", {class:"dicon drag", style:"left:24px;top:120px", role:"img", "aria-label":"Photo beach.jpg"},
      h("span", {class:"em", "aria-hidden":"true"}, "🖼️"), "beach.jpg");
    desk.append(target, item); box.append(desk);
    let sx=0, sy=0, ox=0, oy=0, dragging=false;
    const over = () => {
      const a = item.getBoundingClientRect(), b = target.getBoundingClientRect();
      const cx = a.left + a.width/2, cy = a.top + a.height/2;
      return cx > b.left && cx < b.right && cy > b.top && cy < b.bottom;
    };
    item.addEventListener("pointerdown", e => {
      if (t.ok) return;
      dragging = true; item.setPointerCapture(e.pointerId); item.classList.add("lift");
      sx = e.clientX; sy = e.clientY; t.tried = true;
    });
    item.addEventListener("pointermove", e => {
      if (!dragging) return;
      item.style.transform = `translate(${ox + e.clientX - sx}px, ${oy + e.clientY - sy}px)`;
      target.classList.toggle("hot", over());
    });
    const end = e => {
      if (!dragging) return; dragging = false; item.classList.remove("lift");
      if (over()){
        t.ok = true; item.remove(); target.classList.remove("hot");
        target.lastChild.textContent = "Holiday (1 file)";
        msg(box, "The photo is in the folder.", "ok");
      } else {
        ox += e.clientX - sx; oy += e.clientY - sy;
      }
    };
    item.addEventListener("pointerup", end);
    item.addEventListener("pointercancel", end);
  },
  check: t => !!t.ok, note: t => t.ok ? "" : (t.tried ? "tried, not dropped" : "") },

{ id:"U4", sec:"U", title:"Scroll",
  ask:"Scroll down. Find the green button and click it.",
  build(box, t){
    const paras = [
      "Mare Street Library is open six days a week.",
      "You can borrow books, DVDs and audiobooks for free.",

{ id:"C1", sec:"C", title:"Open and reply",

      {from:"Shop Offers", sub:"50% off shoes this week!", body:"Big sale on all shoes. Shop now."},
      {from:"Ms Patel (Teacher)", sub:"Class tomorrow", body:"Hello, tomorrow our class is in Room 204. Please reply to this email. Thanks, Ms Patel", teacher:true},

    mails.forEach((mm) => {

      }}, h("b", null, mm.from), mm.sub);

/* ---------- Header ---------- */
function drawRoute(secKey){
  const r = $("route"), c = $("count");
  if (!secKey){ r.classList.add("hidden"); c.classList.add("hidden"); return; }
  r.classList.remove("hidden"); c.classList.remove("hidden");
  r.innerHTML = "";
  const at = ACTIVE_SECS.findIndex(s => s.key === secKey);
  ACTIVE_SECS.forEach((s, i) => {
    r.append(h("li", {class: i < at ? "done" : (i === at ? "now" : ""), "aria-current": i === at ? "step" : null},
      h("span", {class:"stop", "aria-hidden":"true"}), s.name));
  });
  if (secKey === "END"){ r.querySelectorAll("li").forEach(li => li.className = "done"); c.textContent = "Finished"; return; }
  c.textContent = "Question " + (S.idx + 1) + " of " + ACTIVE.length;
}

/* ---------- Scoring ---------- */
function bandFor(p){
  if (p >= 85) return {name:"Independent", say:"You can use a computer on your own. Great!"};
  if (p >= 65) return {name:"Mostly independent", say:"You can do most things. A little practice will help."};
  if (p >= 40) return {name:"Needs some help", say:"You can do some things. We will practise together."};
  return {name:"Needs a lot of help", say:"That's OK. We will learn step by step."};
}
function summary(){
  const secs = ACTIVE_SECS.map(s => {
    const ts = ACTIVE.filter(t => t.sec === s.key);
    return {key:s.key, name:s.name, got: ts.filter(t => S.ans[t.id] === 1).length, of: ts.length};
  });
  const got = secs.reduce((a, s) => a + s.got, 0), of = ACTIVE.length;
  const pct = Math.round(100 * got / of);
  const mins = Math.max(1, Math.round(((S.finished || Date.now()) - S.started) / 60000));
  return {secs, got, of, pct, band: bandFor(pct), mins};
}
function resultCode(R){
  const tasks = ACTIVE.map(t => t.id + ":" + (S.ans[t.id] === undefined ? "-" : S.ans[t.id])).join(",");
  return [VERSION, S.name, S.id, S.cls, S.teacher || "", stamp(new Date(S.finished)), R.mins + "m", R.got + "/" + R.of,
    R.secs.map(s => s.key + "=" + s.got + "/" + s.of).join(";"), tasks, R.band.name].join("|");
}
function resultText(R){
  const lines = [
    "Computer skills check – results", "",
    "Name: " + S.name, "Student number: " + S.id, "ESOL teacher: " + (S.teacher || "-"), "Level: " + (S.cls || "-"),
    "Date: " + stamp(new Date(S.finished)), "Time taken: " + R.mins + " minutes", "",
    "Total: " + R.got + " / " + R.of + " (" + R.pct + "%)", "Result: " + R.band.name, ""
  ];
  R.secs.forEach(s => lines.push(s.name + ": " + s.got + " / " + s.of));
  lines.push("");
  ACTIVE.forEach(t => {
    const a = S.ans[t.id];
    lines.push(t.id + " " + t.title + ": " + (a === 1 ? "✓" : a === "s" ? "didn't understand" : "✗") + (S.notes[t.id] && a !== "s" ? " (" + S.notes[t.id] + ")" : ""));
  });
  lines.push("", "Results code (for the teacher's sheet):", resultCode(R));
  return lines.join("\n");
}

/* ---------- Microsoft Form: fill placeholder answers ---------- */
function formValues(R, code){
  const sec = k => { const x = R.secs.find(s => s.key === k); return x ? x.got + "/" + x.of : "-"; };
  const details = ACTIVE.map(t => t.id + " " + (S.ans[t.id] === 1 ? "✓" : S.ans[t.id] === "s" ? "😕" : "✗")).join(", ");
  return {
    NAME:S.name, NUMBER:S.id, TEACHER:S.teacher || "", LEVEL:FORM_LEVELS[S.level] || S.level || "", CLASS:S.skill || "",
    DATE:stamp(new Date(S.finished)), MINUTES:String(R.mins), SCORE:R.got + "/" + R.of, PERCENT:R.pct + "%", RESULT:R.band.name,
    MOUSE:sec("U"), KEYBOARD:sec("K"), INTERNET:sec("I"), EMAIL:sec("C"), FILES:sec("F"), SAFETY:sec("S"),
    DETAILS:details, RESULTS:code, CODE:code
  };
}
function fillForm(url, R, code){
  const vals = formValues(R, code);
  const qi = url.indexOf("?");
  if (qi < 0) return url;
  const base = url.slice(0, qi), rest = url.slice(qi + 1).split("#")[0];
  return base + "?" + rest.split("&").map(pair => {
    const i = pair.indexOf("=");
    if (i < 0) return pair;
    let v; try { v = decodeURIComponent(pair.slice(i + 1).replace(/\+/g, " ")); } catch(e){ return pair; }
    // Choice questions come through in quotes, e.g. "Entry 1"
    const quoted = /^".*"$/.test(v.trim());
    const key = v.trim().replace(/^"|"$/g, "").toUpperCase();
    if (!Object.prototype.hasOwnProperty.call(vals, key)) return pair;
    const out = quoted ? JSON.stringify(vals[key]) : vals[key];
    return pair.slice(0, i) + "=" + encodeURIComponent(out);
  }).join("&");
}

    if (tl) p.set("tl", tl);
    if (fm.value.trim()) p.set("f", fm.value.trim());
    const s = boxes.filter(b => b.c.checked).map(b => b.s.key).join("");
    if (s && s !== "UKICFS") p.set("s", s);
    out.value = base + (p.toString() ? "?" + p.toString() : "");
    st.textContent = fm.value.trim() && !/=(NAME|SCORE|RESULTS|CODE)\b/i.test(fm.value) ? "This form link has no placeholder words (like NAME or SCORE), so results won't fill in." : "";
  };
  [em, fm].forEach(x => x.addEventListener("input", build));
  boxes.forEach(b => b.c.addEventListener("change", build));
  build();

  app.append(
    h("label", {class:"lab", for:"te"}, "Teachers"), em,
    h("p", {class:"muted"}, "Put just your own name to make a link for your class: the first page is then skipped and your name goes with every result. Several names (one per line) gives a drop-down on the first page instead. An email after a comma is optional."),
    h("label", {class:"lab", for:"tf"}, "Microsoft Form link (puts results into Excel)"), fm,
    h("p", {class:"muted"}, DEFAULT_FORM ? "A form is already built into this test. Only fill this in to use a different form." : "Students get a 'Send to my teacher' button. Their results fill in the form, they click Submit, and a new row appears in your Excel sheet."),
    h("details", null, h("summary", null, "How to make the form (once, about 10 minutes)"),
      h("p", null, "1. Go to forms.office.com and make a new form, e.g. 'Computer skills check results'."),
      h("p", null, "2. Add a Text question for each column you want, in any order. Use these titles: Name, Student number, ESOL teacher, Level, Class, Date, Minutes, Score, Percent, Result, Mouse and screen, Keyboard, Internet, Email, Files, Staying safe, Details. Turn on 'Long answer' for Details."),
      h("p", null, "3. In Settings, choose who can respond. 'Anyone can respond' lets students at home send without signing in."),
      h("p", null, "4. Click '…' (top right), then 'Get pre-filled URL'. In each box type the matching placeholder word in capitals: NAME, NUMBER, TEACHER, LEVEL, CLASS, DATE, MINUTES, SCORE, PERCENT, RESULT, MOUSE, KEYBOARD, INTERNET, EMAIL, FILES, SAFETY, DETAILS."),
      h("p", null, "5. Click 'Get pre-filled URL', copy the link and paste it in the box above."),
      h("p", null, "6. To see results in Excel: in the form, open Responses, then 'Open results in Excel'. The sheet is saved in your OneDrive and updates as students submit. You can share it with other teachers.")),
    h("h3", null, "Sections"), h("div", {class:"tgrid"}, boxes.map(b => b.el)),
    h("h3", null, "Your class link"), out, st,
    h("div", {class:"actions"},
      h("button", {class:"btn", type:"button", onclick: () => copyText(out.value, ok => st.textContent = ok ? "Link copied." : "Select the link and copy it.")}, "Copy link"),
      h("a", {class:"btn ghost", href:"#", onclick: (e) => { e.preventDefault(); window.open(out.value, "_blank", "noopener"); }}, "Try the test")));

  // Collator
  app.append(h("h2", {style:"margin-top:32px"}, "Results sheet"),
    h("p", null, "For results sent by email, Teams or a downloaded file. Paste them here and any results codes are put into a table."));
  const paste = h("textarea", {class:"field", rows:"6", "aria-label":"Paste results here", placeholder:"ICTv3|Fatima Ali|12345678|…"});
  const tableBox = h("div", {class:"overflow"});
  let rows = [];
  const parse = () => {
    const found = (paste.value.match(/ICTv[23]\|[^\r\n"]+/g) || []);
    const seen = new Set();
    rows = [];
    found.forEach(line => {
      const p = line.split("|");
      let teacher = "";
      if (p[0] === "ICTv3"){ teacher = p[4]; p.splice(4, 1); }
      if (p.length < 10) return;
      const key = p[1] + p[2] + p[4];
      if (seen.has(key)) return; seen.add(key);
      const [got, of] = p[6].split("/").map(Number);
      const secs = {}; p[7].split(";").forEach(x => { const [k, v] = x.split("="); secs[k] = v; });
      const tasks = {}; p[8].split(",").forEach(x => { const [k, v] = x.split(":"); tasks[k] = v; });
      rows.push({name:p[1], id:p[2], cls:p[3], teacher, date:p[4], mins:p[5].replace("m", ""), got, of, pct: of ? Math.round(100 * got / of) : 0, secs, tasks, band:p[9].trim()});
    });
    rows.sort((a, b) => a.name.localeCompare(b.name));
    tableBox.innerHTML = "";
    if (!rows.length){ tableBox.append(h("p", {class:"muted"}, paste.value.trim() ? "No results codes found in the text." : "")); return; }
    const secKeys = SECTIONS.map(s => s.key).filter(k => rows.some(r => r.secs[k]));
    const taskIds = TASKS.map(t => t.id).filter(id => rows.some(r => r.tasks[id] !== undefined));
    tableBox.append(h("p", null, h("b", null, rows.length + " student" + (rows.length > 1 ? "s" : ""))),
      h("table", {class:"coll"},
        h("thead", null, h("tr", null, ["Name","Student no.","Level","Teacher","Date","Mins","Score","%","Result"].map(x => h("th", null, x)),
          secKeys.map(k => h("th", null, SECTIONS.find(s => s.key === k).name)), taskIds.map(id => h("th", null, id)))),
        h("tbody", null, rows.map(r => h("tr", null,
          [r.name, r.id, r.cls, r.teacher, r.date, r.mins, r.got + "/" + r.of, r.pct, r.band].map(x => h("td", null, x)),
          secKeys.map(k => h("td", null, r.secs[k] || "")),
          taskIds.map(id => h("td", null, r.tasks[id] === "1" ? "✓" : r.tasks[id] === "0" ? "✗" : r.tasks[id] === "s" ? "😕" : "")))))));
    const csv = () => {
      const esc = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
      const head = ["Name","Student number","Level","Teacher","Date","Minutes","Score","Out of","Percent","Result"].concat(secKeys.map(k => SECTIONS.find(s => s.key === k).name), taskIds.map(id => id + " " + TASKS.find(t => t.id === id).title));
      const body = rows.map(r => [r.name, r.id, r.cls, r.teacher, r.date, r.mins, r.got, r.of, r.pct, r.band].concat(secKeys.map(k => r.secs[k] || ""), taskIds.map(id => r.tasks[id] === "1" ? 1 : r.tasks[id] === "0" ? 0 : r.tasks[id] === "s" ? "didn't understand" : "")));
      return [head].concat(body).map(row => row.map(esc).join(",")).join("\r\n");
    };
    tableBox.append(h("div", {class:"actions"},
      h("button", {class:"btn", type:"button", onclick: () => download("ICT-check-results.csv", "\uFEFF" + csv(), "text/csv")}, "Download for Excel (CSV)")));
  };
  paste.addEventListener("input", parse);
  app.append(paste, tableBox);
}

/* ---------- No pasting in the keyboard tasks (typing is the skill) ---------- */
function blockPaste(e){
  if (CFG.mode === "teacher" || !S || S.finished) return;
  const el = e.target;
  if (!el.closest || !el.closest("[data-nopaste]")) return;
  e.preventDefault();
  if (cur) cur.__pasted = true;
  let tip = el.parentNode.querySelector(":scope > .paste-tip");
  if (!tip){ tip = h("span", {class:"err paste-tip", role:"alert"}); el.after(tip); }
  tip.textContent = "Please type this. Don't paste.";
  clearTimeout(tip._t); tip._t = setTimeout(() => tip.remove(), 4000);
}
app.addEventListener("paste", blockPaste, true);
app.addEventListener("drop", blockPaste, true);

/* ---------- Start ---------- */
$("bigBtn").addEventListener("click", e => {
  const on = document.body.classList.toggle("big");
  e.currentTarget.setAttribute("aria-pressed", on ? "true" : "false");
  try { localStorage.setItem(STORE + "_big", on ? "1" : ""); } catch(err){}
});
try { if (localStorage.getItem(STORE + "_big")){ document.body.classList.add("big"); $("bigBtn").setAttribute("aria-pressed", "true"); } } catch(e){}
window.addEventListener("beforeunload", e => { if (S && !S.finished && S.idx > 0){ e.preventDefault(); e.returnValue = ""; } });

if (CFG.mode === "teacher") teacherScreen();
else {
  const saved = load();
  if (saved && saved.v === VERSION && saved.finished && saved.cfg === CFG.secs){ S = saved; finish(); }
  else startScreen();
}
})();
</script>
</body>
